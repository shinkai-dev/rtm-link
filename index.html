 'list-chip':elx=>{LS[elx.dataset.app][elx.dataset.f]=elx.dataset.v;renderList(elx.dataset.app)},
 'view-save':elx=>openFormModal('view-name',elx.dataset.app),
 'view-apply':elx=>{const key=elx.dataset.app;const v=savedViews(key)[+elx.dataset.i];if(!v)return;LS[key]=clone(v.state);rerender();toast(`ビュー「${esc(v.name)}」を適用しました`,null,2500)},
 'view-del':elx=>{const key=elx.dataset.app;const sv=clone(S.meta.savedViews||{});sv[key]=(sv[key]||[]).filter((_,i)=>i!==+elx.dataset.i);putMeta('savedViews',sv);rerender()},
 'tbl-sort':elx=>{const st=TB[elx.dataset.app];if(!st)return;if(st.sort===elx.dataset.key)st.dir*=-1;else{st.sort=elx.dataset.key;st.dir=1}
  const app=APP(elx.dataset.app);const p=app.blocks.find(b=>b.type==='table')?.props||{};el('#tbl-'+app.id).innerHTML=tableBody(app,p)},
 'tbl-page':elx=>{const st=TB[elx.dataset.app];const app=APP(elx.dataset.app);const p=app.blocks.find(b=>b.type==='table')?.props||{};
  st.page+=+elx.dataset.d;el('#tbl-'+app.id).innerHTML=tableBody(app,p)},
 'bulk-del':elx=>{const app=APP(elx.dataset.app);const st=TB[app.id];if(!st||!st.sel.length)return;
  confirmBox(`${st.sel.length}件のデータを削除しますか？`,'削除後8秒以内なら元に戻せます。','一括削除',async()=>{
   const recs=S.records.filter(r=>st.sel.includes(r.id));S.records=S.records.filter(r=>!st.sel.includes(r.id));
   for(const r of recs)await DB.del('records',r.id);st.sel=[];offerUndo(recs,`${recs.length}件を削除しました`);rerender()})},
 'bulk-clear':elx=>{const app=APP(elx.dataset.app);TB[app.id].sel=[];const p=app.blocks.find(b=>b.type==='table')?.props||{};el('#tbl-'+app.id).innerHTML=tableBody(app,p)},
 'create-type':elx=>openFormModal('app-create',elx.dataset.t),
 'export':()=>{closePanels();const data={exportedAt:now(),users:S.users,apps:S.apps,records:S.records,notifications:S.notifications,meta:S.meta};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rtm-link-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('データを書き出しました（rtm-link-export.json）',null,3500,'ok')},
 'about':()=>{closePanels();openModal(modalShell('このデモについて',
  `<div class="md"><h3>RTM Link — 社員が育てるコミュニティ</h3><p>社員がつながり、学び合い、自ら会社の文化と仕組みを育てるプラットフォームのデモです。標準10機能に加えて、<strong>全社員が承認なしで大機能を作成</strong>できます（ページ型 / データ管理型 / ワークフロー型）。</p><h4>技術構成</h4><ul><li>HTML / CSS / JavaScript のみ（フレームワーク不使用）</li><li>データ保存: IndexedDB（このブラウザ・端末内）</li><li>画面構成: JSON定義 ＋ コンポーネントレジストリ</li><li>編集: HTML Drag and Drop API</li></ul><h4>デモの制約（仕様書 §9）</h4><ul><li>複数端末間の同期・リアルタイム共有はありません</li><li>サーバー認証・安全なアクセス制御は本番で別途設計します</li><li>社員・投稿はすべてサンプルデータです</li><li>匿名投稿のプライバシー保護は本番環境で強化します</li></ul><blockquote>現在ログイン中: ${esc(meU().name)}（デモユーザー）。右上メニューからデータをリセット・書き出しできます。</blockquote></div>`,
  `<button type="button" class="btn pri" data-action="modal-close">わかりました</button>`),true)},
 'reset':()=>{closePanels();confirmBox('デモデータをリセットしますか？','すべての投稿・作成した機能が初期サンプルデータに戻ります。この操作は元に戻せません。','リセットする',async()=>{
  for(const s of ['users','apps','records','notifications','meta'])await DB.clear(s);
  location.hash='#/home';location.reload()})}
};

/* ---------- global bindings ---------- */
function bindGlobal(){
 document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!e.target.closest('[data-panel],[data-panel-toggle],.ver-pop')&&!e.target.closest('[data-action="ver-toggle"]'))closePanels();
  if(!t)return;
  const a=t.dataset.action;
  if(t.tagName==='A'&&a==='modal-close'){closeModal();return}
  if(t.closest('form')&&t.type!=='submit'&&t.tagName==='BUTTON')e.preventDefault();
  const fn=Actions[a];if(fn){if(t.tagName==='BUTTON'||t.tagName==='A')e.preventDefault();fn(t,e)}
 });
 document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=Forms[f.dataset.form];if(fn)fn(f)});
 const listSoon=debounce(key=>renderList(key),180);
 const searchSoon=debounce(()=>{const b=el('#search-body');if(b)b.innerHTML=searchBody()},200);
 const tableSoon=debounce(appId=>{const app=APP(appId);const p=app?.blocks.find(b=>b.type==='table')?.props||{};const c=el('#tbl-'+appId);if(c)c.innerHTML=tableBody(app,p)},180);
 document.addEventListener('input',e=>{
  const t=e.target;const k=t.dataset.input;if(!k)return;
  if(k==='list'){LS[t.dataset.app][t.dataset.f]=t.value;listSoon(t.dataset.app)}
  else if(k==='search-page'){LS.search.q=t.value;LS.search.tagMode=false;searchSoon()}
  else if(k==='table-q'){const st=TB[t.dataset.app]||(TB[t.dataset.app]={q:'',sort:'',dir:1,sel:[],page:0});st.q=t.value;st.page=0;tableSoon(t.dataset.app)}
  else if(k==='ins'){const b=E.app?.blocks.find(x=>x.id===E.sel);if(!b)return;
   b.props[t.dataset.k]=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;scheduleCanvas()}
  else if(k==='ins-step'){const b=E.app?.blocks.find(x=>x.id===E.sel);if(!b)return;b.props[t.dataset.k][+t.dataset.i]=t.value;scheduleCanvas()}
  else if(k==='ins-item'){const b=E.app?.blocks.find(x=>x.id===E.sel);if(!b)return;b.props[t.dataset.k][+t.dataset.i][t.dataset.sk]=t.value;scheduleCanvas()}
  else if(k==='app-name'){if(!E.app)return;E.app.name=t.value;E.dirty=true;const d=el('#dirty-dot');if(d)d.style.display=''}
  else if(k==='proj-progress'){const l=el('#prog-label-'+t.dataset.id);if(l)l.textContent=t.value+'%'}
  else if(k==='md-prev'){const p=el('#md-preview');if(p&&p.style.display!=='none')p.innerHTML=md(t.value)}
 });
 document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.closest('.pick')){const grp=t.closest('.pickgrid');els('.pick',grp).forEach(p=>p.classList.remove('on'));t.closest('.pick').classList.add('on')}
  const c=t.dataset.change;
  if(c==='md-toggle'){const p=el('#md-preview');const ta=el('#modal-root textarea[name=body]');if(p){p.style.display=t.checked?'block':'none';if(t.checked)p.innerHTML=md(ta?.value||'')}}
  else if(c==='publish'){if(!E.app)return;E.app.status=t.checked?'published':'draft';await saveEditor(true);renderRoute(false);toast(t.checked?'公開しました。全社員に表示されます':'下書きに戻しました（自分のみ表示）',null,3200,'ok')}
  else if(c==='sel-row'){const st=TB[t.dataset.app];if(!st)return;const id=t.dataset.id;
   if(t.checked){if(!st.sel.includes(id))st.sel.push(id)}else st.sel=st.sel.filter(x=>x!==id);
   const app=APP(t.dataset.app);const p=app.blocks.find(b=>b.type==='table')?.props||{};el('#tbl-'+app.id).innerHTML=tableBody(app,p)}
  else if(c==='sel-all'){const app=APP(t.dataset.app);const st=TB[app.id];const p=app.blocks.find(b=>b.type==='table')?.props||{};
   const kind=app.type==='workflow'?'submission':'datarecord';let rs=S.records.filter(r=>r.appKey===app.key&&r.kind===kind);
   if(st.q)rs=rs.filter(r=>matchQ(r,st.q));const ps=p.pageSize||8;const page=rs.slice(st.page*ps,st.page*ps+ps);
   if(t.checked)page.forEach(r=>{if(!st.sel.includes(r.id))st.sel.push(r.id)});else st.sel=st.sel.filter(id=>!page.some(r=>r.id===id));
   el('#tbl-'+app.id).innerHTML=tableBody(app,p)}
  else if(c==='ftype'){const row=t.closest('.frow2');const o=el('[name=fopts]',row);if(o)o.style.opacity=t.value==='sel'?'1':'.4'}
  else if(t.dataset.input==='proj-progress'){const r=REC(t.dataset.id);if(!r)return;r.progress=+t.value;if(r.progress===100)r.status='done';else if(r.status==='done')r.status='active';await saveRec(r);rerender();toast('進捗を更新しました',null,2500,'ok')}
  else if(t.dataset.input==='ins'||t.dataset.input==='ins-item'){scheduleCanvas()}
 });
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   if(el('#confirm-root').classList.contains('open'))closeConfirm();
   else if(el('#modal-root').classList.contains('open'))closeModal();
   else if(DR)closeDrawer();
   else closePanels();
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&E.active){e.preventDefault();saveEditor(false)}
  if(e.key==='/'&&!e.target.closest('input,textarea,select')&&!el('#modal-root').classList.contains('open')){const s=el('.top-search input');if(s&&getComputedStyle(s.parentElement).display!=='none'){e.preventDefault();s.focus()}else navigate('#/search')}
 });
 window.addEventListener('hashchange',()=>{closePanels();closeModal();closeDrawer();Actions['nav-close']();renderRoute(true)});
 window.addEventListener('beforeunload',e=>{if(E.active&&E.dirty){e.preventDefault();e.returnValue=''}});
 window.addEventListener('resize',debounce(()=>{if(E.active){const mq=window.matchMedia('(max-width:1024px)').matches;const pb=el('#pal-m-btn');if(pb)pb.style.display=mq?'inline-flex':'none';const cb=el('#ins-close');if(cb)cb.style.display=mq&&E.sel?'grid':'none'}},200));
}

/* ---------- boot ---------- */
async function boot(){
 const t0=Date.now();
 try{
  DB=await openDB();
  const [users,apps,records,notifs,metaArr]=await Promise.all(['users','apps','records','notifications','meta'].map(s=>DB.getAll(s)));
  S.users=users;S.apps=apps;S.records=records;S.notifications=notifs;metaArr.forEach(m=>S.meta[m.key]=m.value);
  if(!S.meta.seeded){
   const seed=makeSeed();S.users=seed.users;S.apps=seed.apps;S.records=seed.records;S.notifications=seed.notifications;
   S.meta={seeded:true,streak:4,savedViews:{knowledge:[{name:'AWSの知見',state:{q:'AWS',cat:'all',sort:'likes',tag:''}}]}};
   await Promise.all([DB.bulk('users',S.users),DB.bulk('apps',S.apps),DB.bulk('records',S.records),DB.bulk('notifications',S.notifications),
    ...Object.entries(S.meta).map(([k,v])=>DB.put('meta',{key:k,value:v}))]);
   S.users.forEach(u=>u.badges=computeBadges(u));await DB.bulk('users',S.users);
  }
  S.me='u1';
  const today=new Date().toDateString();
  if(S.meta.lastVisit!==today){const y=new Date(Date.now()-864e5).toDateString();S.meta.streak=S.meta.lastVisit===y?(S.meta.streak||0)+1:1;S.meta.lastVisit=today;putMeta('streak',S.meta.streak);putMeta('lastVisit',today)}
  refreshPoints();
  buildShell();bindGlobal();
  if(!location.hash)location.hash='#/home';
  renderRoute(true);
  const wait=Math.max(0,500-(Date.now()-t0));
  setTimeout(()=>{el('#splash').classList.add('hide');setTimeout(()=>el('#splash')?.remove(),450);
   if(!S.meta.welcomed){toast(`${I('link',16)} RTM Link へようこそ、${esc(meU().name.split(' ')[0])}さん！サンプルデータを読み込みました`,null,5000,'ok');putMeta('welcomed',true)}
   else if(DB.mem){toast('この環境ではIndexedDBが使えないため、メモリ保存で動作しています（リロードでリセット）',null,6000,'warn')}
  },wait);
 }catch(err){
  console.error(err);
  el('#splash').innerHTML=`<div class="mark" style="animation:none;background:var(--danger)">${I('alert-triangle',28)}</div><h1>起動エラー</h1><p style="max-width:320px;text-align:center">初期化に失敗しました。ページを再読み込みしてください。<br><small style="color:var(--muted)">${esc(err?.message||err)}</small></p><button class="btn pri" onclick="location.reload()">再読み込み</button>`;
 }
}
boot();
})();
</script>
